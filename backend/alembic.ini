# =============================================================================
#  Kumaran Crackers - Alembic configuration
#  The database URL is intentionally NOT stored here. `alembic/env.py` reads it
#  from the application settings so credentials stay in the environment only.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, readable revision filenames: 20260919_1430-ab12cd34_add_products.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# (none configured)

# ---- Logging ----------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
