[project]
name = "kumaran-crackers-backend"
version = "1.0.0"
description = "Backend API for Kumaran Crackers - Celebrate Every Moment with Kumaran Crackers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
